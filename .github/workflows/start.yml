# Starts the arena on Jens's PC when a script is pushed to input/<name>/script.js on main.
# This repo only sends the start signal (a free GitHub-hosted runner, a few seconds); the games run on the PC in the
# private Hearthlands repo (its workflow arena.yml), which writes the reports back to output/ here.
# Secret ARENA_START: a fine-grained token with Actions read and write on the private Hearthlands repo only.
name: Start the arena
on:
  push:
    branches: [main]
    paths: ['input/**/script.js']
  workflow_dispatch:
    inputs:
      names:
        description: 'Script names to play again (input/<name>), separated by spaces; blank = all'
        type: string
        default: ''
permissions:
  contents: read
jobs:
  start:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          TOKEN: ${{ secrets.ARENA_START }}
          NAMES: ${{ inputs.names }}
        with:
          script: |
            const ok = /^input\/([a-z0-9][a-z0-9.\-]{0,40})\/script\.js$/;
            let names = [];
            if (context.eventName === 'workflow_dispatch') names = String(process.env.NAMES || '').split(/\s+/).filter(Boolean);
            else {
              const p = context.payload;
              if (/^0+$/.test(p.before)) names = []; // a new branch: play everything (blank)
              else {
                const { data } = await github.rest.repos.compareCommitsWithBasehead({ ...context.repo, basehead: `${p.before}...${p.after}` });
                for (const f of data.files || []) { const m = f.filename.match(ok); if (m && f.status !== 'removed') names.push(m[1]); }
                if (!names.length) { core.info('no script changed'); return; }
              }
            }
            names = [...new Set(names)];
            if (!process.env.TOKEN) throw new Error('the secret ARENA_START is missing in this repository');
            const r = await fetch('https://api.github.com/repos/jenzgekheid-lang/Hearthlands/actions/workflows/arena.yml/dispatches', {
              method: 'POST', headers: { Authorization: `Bearer ${process.env.TOKEN}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' },
              body: JSON.stringify({ ref: 'main', inputs: { sha: context.sha, names: names.join(' ') } }) });
            if (!r.ok) throw new Error(`could not start the arena: ${r.status} ${await r.text()}`);
            core.info(`arena started for ${names.join(', ') || 'all scripts'} at ${context.sha.slice(0, 7)}`);
